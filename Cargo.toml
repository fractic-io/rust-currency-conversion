[package]
name = "fractic-currency-conversion"
version = "0.1.0"
edition = "2021"

[dependencies]
fractic-core = { git = "https://github.com/fractic-io/rust-core.git" }
fractic-env-config = { git = "https://github.com/fractic-io/rust-env-config.git" }
fractic-server-error = { git = "https://github.com/fractic-io/rust-server-error.git" }
chrono = { version = "^0.4.40", features = ["serde"] }
serde = "^1.0.218"
serde_derive = "^1.0.218"
iso_currency = { version = "^0.5.3", features = ["with-serde"] }
serde_json = "^1.0.140"
async-trait = "^0.1.88"
reqwest = { version = "^0.12.14", features = ["rustls-tls", "json"] }
tokio = { version = "^1.43.0", features = ["fs"] }